<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于 Agent 的图像匹配系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .upload-box {
            border: 3px dashed #ddd;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
            background: #fafafa;
        }
        
        .upload-box:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .upload-box.has-image {
            border-color: #4CAF50;
            background: #e8f5e9;
        }
        
        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            display: none;
            margin-top: 10px;
        }
        
        .preview-image.show {
            display: block;
        }
        
        .button-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-section {
            display: none;
            margin-top: 30px;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-title {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .comparison-image {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        
        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4CAF50;
        }
        
        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #f44336;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 基于 Agent 的图像匹配系统</h1>
        <p class="subtitle">AI 自动推荐算法 · 智能参数调优 · 多 Agent 协作</p>
        
        <!-- 上传区域 -->
        <div class="upload-section">
            <div class="upload-box" id="templateBox" onclick="document.getElementById('templateInput').click()">
                <div class="upload-icon">📷</div>
                <h3>模板图</h3>
                <p>点击上传或拖拽到此处</p>
                <img id="templatePreview" class="preview-image" />
                <input type="file" id="templateInput" accept="image/*" onchange="handleFileSelect(event, 'template')">
            </div>
            
            <div class="upload-box" id="sceneBox" onclick="document.getElementById('sceneInput').click()">
                <div class="upload-icon">🖼️</div>
                <h3>场景图</h3>
                <p>点击上传或拖拽到此处</p>
                <img id="scenePreview" class="preview-image" />
                <input type="file" id="sceneInput" accept="image/*" onchange="handleFileSelect(event, 'scene')">
            </div>
        </div>
        
        <!-- 按钮区域 -->
        <div class="button-section">
            <button class="btn" onclick="uploadImages()" id="uploadBtn">⬆️ 上传图像</button>
            <button class="btn" onclick="startMatching()" id="matchBtn" disabled>🚀 开始匹配</button>
            <button class="btn" onclick="resetAll()" id="resetBtn">🔄 重置</button>
        </div>
        
        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在执行匹配，请稍候...</p>
            <p style="color: #666; font-size: 0.9em;">Agent 正在分析图像并推荐最优算法</p>
        </div>
        
        <!-- 消息提示 -->
        <div id="messageContainer"></div>
        
        <!-- 结果区域 -->
        <div class="result-section" id="resultSection">
            <h2 class="result-title">✨ 匹配结果</h2>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="bestAlgo">-</div>
                    <div class="stat-label">最佳算法</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="confidence">-</div>
                    <div class="stat-label">置信度</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="location">-</div>
                    <div class="stat-label">匹配位置</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="time">-</div>
                    <div class="stat-label">执行时间</div>
                </div>
            </div>
            
            <img id="comparisonImage" class="comparison-image" />
        </div>
    </div>
    
    <script>
        let templateId = null;
        let sceneId = null;
        let templateFile = null;
        let sceneFile = null;
        
        // 处理文件选择
        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;
            
            const preview = document.getElementById(type + 'Preview');
            const box = document.getElementById(type + 'Box');
            
            // 显示预览
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.add('show');
                box.classList.add('has-image');
                
                if (type === 'template') {
                    templateFile = file;
                } else {
                    sceneFile = file;
                }
            };
            reader.readAsDataURL(file);
        }
        
        // 上传图像
        async function uploadImages() {
            if (!templateFile || !sceneFile) {
                showMessage('请先选择两张图像！', 'error');
                return;
            }
            
            const formData = new FormData();
            formData.append('template', templateFile);
            formData.append('scene', sceneFile);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    templateId = data.template_id;
                    sceneId = data.scene_id;
                    document.getElementById('matchBtn').disabled = false;
                    showMessage('图像上传成功！', 'success');
                } else {
                    showMessage('上传失败：' + data.error, 'error');
                }
            } catch (error) {
                showMessage('上传失败：' + error.message, 'error');
            }
        }
        
        // 开始匹配
        async function startMatching() {
            if (!templateId || !sceneId) {
                showMessage('请先上传图像！', 'error');
                return;
            }
            
            // 显示加载动画
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('matchBtn').disabled = true;
            
            try {
                const response = await fetch('/api/match', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        template_id: templateId,
                        scene_id: sceneId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data);
                    showMessage(data.message || '匹配成功！', 'success');
                } else {
                    showMessage('匹配失败：' + data.error, 'error');
                }
            } catch (error) {
                showMessage('匹配失败：' + error.message, 'error');
            } finally {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('matchBtn').disabled = false;
            }
        }
        
        // 显示结果
        function displayResults(data) {
            const best = data.best;
            
            // 更新统计
            document.getElementById('bestAlgo').textContent = best.algorithm || '-';
            document.getElementById('confidence').textContent = (best.confidence * 100).toFixed(1) + '%';
            document.getElementById('location').textContent = best.location ? `(${best.location[0]}, ${best.location[1]})` : '-';
            document.getElementById('time').textContent = best.elapsed_ms ? best.elapsed_ms.toFixed(1) + 'ms' : '-';
            
            // 显示对比图
            if (data.comparison_image) {
                document.getElementById('comparisonImage').src = data.comparison_image;
            }
            
            // 显示结果区域
            document.getElementById('resultSection').classList.add('show');
        }
        
        // 显示消息
        function showMessage(message, type) {
            const container = document.getElementById('messageContainer');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = message;
            container.innerHTML = '';
            container.appendChild(div);
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }
        
        // 重置
        function resetAll() {
            templateId = null;
            sceneId = null;
            templateFile = null;
            sceneFile = null;
            
            document.getElementById('templateInput').value = '';
            document.getElementById('sceneInput').value = '';
            document.getElementById('templatePreview').src = '';
            document.getElementById('scenePreview').src = '';
            document.getElementById('templateBox').classList.remove('has-image');
            document.getElementById('sceneBox').classList.remove('has-image');
            document.getElementById('matchBtn').disabled = true;
            document.getElementById('resultSection').classList.remove('show');
            document.getElementById('messageContainer').innerHTML = '';
        }
        
        // 拖拽上传支持
        document.querySelectorAll('.upload-box').forEach(box => {
            box.addEventListener('dragover', (e) => {
                e.preventDefault();
                box.style.borderColor = '#667eea';
                box.style.background = '#f0f4ff';
            });
            
            box.addEventListener('dragleave', () => {
                box.style.borderColor = '#ddd';
                box.style.background = '#fafafa';
            });
            
            box.addEventListener('drop', (e) => {
                e.preventDefault();
                box.style.borderColor = '#ddd';
                box.style.background = '#fafafa';
                
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const input = box.querySelector('input[type="file"]');
                    input.files = files;
                    handleFileSelect({target: {files: files}}, 
                        box.id === 'templateBox' ? 'template' : 'scene');
                }
            });
        });
    </script>
</body>
</html>
